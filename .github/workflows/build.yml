name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/manfromtunis/cloudron-litellm-app

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate package
        run: |
          jq -e '.id and .version and .httpPort and .healthCheckPath' CloudronManifest.json > /dev/null
          test "$(jq -r .version CloudronManifest.json)" = "$(sed -n 's/^\[\(.*\)\]$/\1/p' CHANGELOG | head -n1)"
          test "$(jq -r .upstreamVersion CloudronManifest.json)" = "$(sed -n 's/^ARG LITELLM_VERSION=//p' Dockerfile)"
          bash -n start.sh test/local-run.sh
          shellcheck start.sh test/local-run.sh

      - name: Compute image tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.tag.outputs.push == 'true' 
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.tag.outputs.push == 'true' }}
          load: ${{ steps.tag.outputs.push != 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=min

      # The package's real gate: the image is run the way Cloudron runs it,
      # with a read-only root filesystem and a live PostgreSQL and Redis.
      - name: Run the package under Cloudron's constraints
        if: steps.tag.outputs.push != 'true'
        run: ./test/local-run.sh "${IMAGE}:${{ steps.tag.outputs.value }}"
